# Blockcraft Vault — wallet application, PostgreSQL and logical backups.
name: blockcraft-vault
services:
  db:
    image: postgres:${POSTGRES_VERSION:-16.3-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockcraft-vault}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
    - type: bind
      source: /srv/app-data/blockcraft-vault/postgres
      target: /var/lib/postgresql/data
      bind:
        create_host_path: false
    networks:
    - private
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  db-backup:
    image: prodrigestivill/postgres-backup-local:16@sha256:a0103fbce0c48ccc7693ddbb2a2bfa733048db845354f635efef9e4566de185d
    deploy:
      replicas: ${BACKUP_REPLICAS:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-blockcraft-vault}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: -Z1 --no-owner --no-privileges
      BACKUP_SUFFIX: .sql.gz
      BACKUP_ON_START: 'TRUE'
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-15 3 * * 0}
      BACKUP_KEEP_MINS: ${POSTGRES_BACKUP_KEEP_MINUTES:-10080}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${POSTGRES_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${POSTGRES_BACKUP_KEEP_MONTHS:-3}
      TZ: ${POSTGRES_BACKUP_TIMEZONE:-America/Chicago}
    volumes:
    - type: bind
      source: /srv/app-backups/blockcraft-vault
      target: /backups
      bind:
        create_host_path: false
    networks:
    - private
  blockcraft-vault:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${APP_VERSION}
    deploy:
      replicas: ${APP_REPLICAS:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      VITE_BLOCKCRAFT_NODE_URL: ${VITE_BLOCKCRAFT_NODE_URL:?Set VITE_BLOCKCRAFT_NODE_URL}
    networks:
      private: null
      proxy:
        aliases:
        - blockcraft-vault-web
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://127.0.0.1:8000/',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
networks:
  private: null
  proxy:
    external: true
